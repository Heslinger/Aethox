services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redhills
      POSTGRES_PASSWORD: redhills_dev
      POSTGRES_DB: redhills_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redhills -d redhills_engine"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - redhills_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - redhills_net

  egress-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql+asyncpg://redhills:redhills_dev@postgres:5432/redhills_engine
      REDIS_URL: redis://redis:6379/0
      EGRESS_MONITOR_DOMAIN: egress-monitor
      EGRESS_MONITOR_PORT: "9090"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - redhills_net

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "redhills_engine.run_orchestrator"]
    environment:
      DATABASE_URL: postgresql+asyncpg://redhills:redhills_dev@postgres:5432/redhills_engine
      REDIS_URL: redis://redis:6379/0
      EGRESS_MONITOR_DOMAIN: egress-monitor:9090
      MAX_CONCURRENT_SCANS: "5"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - redhills_net

volumes:
  pgdata:
  redisdata:

networks:
  redhills_net:
    driver: bridge
